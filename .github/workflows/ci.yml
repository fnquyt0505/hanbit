name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (0 warning — TreatWarningsAsErrors)
        run: dotnet build --no-restore --configuration Release

      - name: Format check
        run: dotnet format --no-restore --verify-no-changes

      - name: Validate content (RULES §7)
        run: dotnet run --project tools/Hanbit.ContentValidator --no-build --configuration Release -- ./content

      - name: Install Playwright Chromium
        run: pwsh tests/Hanbit.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test --no-build --configuration Release

  # Build image giống Render + chạy thử (Production, cổng 10000)
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t hanbit:ci .

      - name: Smoke test container
        run: |
          docker run -d --name hanbit -p 8080:10000 hanbit:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          set -x
          test "$(curl -fsS http://localhost:8080/health)" = "Healthy"
          curl -fsS http://localhost:8080/ | grep -q '<html lang="vi">'
          curl -fsS http://localhost:8080/css/app.css | grep -q 'tailwindcss v4'
          curl -fsS -o /dev/null http://localhost:8080/lib/alpinejs/alpine.min.js
          test "$(docker exec hanbit id -u)" != "0"
          docker exec hanbit test -f /app/content/hangul.json
          docker exec hanbit test -f /app/content/LICENSE-DATA.md

      - name: Container logs
        if: always()
        run: docker logs hanbit || true
