# Render Blueprint — https://render.com/docs/blueprint-spec
# Không đặt secret ở đây (RULES §8). Secret (nếu có) khai báo trên dashboard Render.
services:
  - type: web
    name: hanbit
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Chỉ deploy commit trên main khi các GitHub check (CI build-test) đã xanh
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Giai đoạn 8 (T8.1): chuỗi kết nối PostgreSQL (Neon, định dạng .NET). sync: false → giá trị nhập trên dashboard Render,
      # KHÔNG nằm trong repo; Blueprint sync không ghi đè. Bỏ trống → app chạy chế độ khách.
      - key: ConnectionStrings__Hanbit
        sync: false
      # Giai đoạn 8 (T8.2): Google OAuth — nhập trên dashboard (sync: false). Thiếu → không bật đăng nhập (chế độ khách).
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      # Giai đoạn 9 — nhắc học (Web Push): khóa VAPID tạo bằng `npx web-push generate-vapid-keys`, đặt trên dashboard
      - key: Push__PublicKey
        sync: false
      - key: Push__PrivateKey
        sync: false
      # T9.2: token cho POST /internal/reminders/run (≥ 32 ký tự, `openssl rand -hex 32`) — trùng GitHub secret REMINDER_RUN_TOKEN
      - key: Reminders__RunToken
        sync: false
